<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SIM-DBR</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F172A;--navy2:#1E293B;--navy3:#334155;
  --accent:#3B82F6;--accent2:#1D4ED8;
  --green:#10B981;--red:#EF4444;--amber:#F59E0B;--purple:#8B5CF6;--orange:#F97316;
  --text:#F8FAFC;--text2:#94A3B8;--text3:#64748B;
  --border:rgba(255,255,255,0.08);--surface:rgba(255,255,255,0.04);
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--navy);color:var(--text);font-family:var(--font);font-size:14px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--navy3);border-radius:4px}

/* LOGIN */
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(59,130,246,.15),transparent 70%)}
.login-box{width:380px;background:var(--navy2);border:1px solid var(--border);border-radius:16px;padding:40px}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.login-logo-icon{width:36px;height:36px;border-radius:9px;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:18px}
.login-logo-name{font-size:18px;font-weight:800}
.login-logo-sub{font-size:11px;color:var(--text3)}
.login-h{font-size:22px;font-weight:800;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.fi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;font-family:var(--font);color:var(--text);outline:none;width:100%;transition:border-color .15s}
.fi:focus{border-color:var(--accent)}
.fi option{background:#1E293B}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent2);color:#fff}.btn-primary:hover{background:var(--accent)}
.btn-full{width:100%}
.btn-ghost{background:var(--surface);color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:rgba(255,255,255,.08);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-green{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3)}.btn-green:hover{background:rgba(16,185,129,.25)}
.btn-red{background:rgba(239,68,68,.12);color:#F87171;border:1px solid rgba(239,68,68,.3)}.btn-red:hover{background:rgba(239,68,68,.2)}
.btn-icon{padding:5px 8px;font-size:13px}

/* SHELL */
#app{display:none;height:100vh;overflow:hidden;flex-direction:row}

/* SIDEBAR */
.sidebar{width:220px;min-width:220px;background:var(--navy2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sb-brand{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.sb-brand-icon{width:30px;height:30px;border-radius:7px;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.sb-brand-name{font-size:14px;font-weight:800;line-height:1}
.sb-brand-ver{font-size:10px;color:var(--text3);font-family:var(--mono)}
.sb-sec{padding:16px 12px 6px;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:9px;margin:1px 6px;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .12s}
.sb-item:hover{background:var(--surface);color:var(--text)}
.sb-item.active{background:rgba(59,130,246,.12);color:var(--accent);font-weight:600}
.sb-item .ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sb-sub{display:flex;align-items:center;gap:8px;margin:1px 6px 1px 28px;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;transition:all .12s}
.sb-sub:hover{background:var(--surface);color:var(--text2)}
.sb-sub.active{color:var(--accent);font-weight:600}
.sb-dot{width:4px;height:4px;border-radius:50%;background:currentColor;flex-shrink:0}
.sb-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface)}
.sb-av{width:30px;height:30px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:700}
.sb-urole{font-size:10px;color:var(--text3)}
.sb-unit{font-size:10px;color:var(--amber);font-weight:600;margin-top:1px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--navy2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text3)}
.breadcrumb .cur{color:var(--text);font-weight:600}
.content{flex:1;overflow-y:auto;padding:24px 28px}

/* PAGE */
.ph{margin-bottom:22px;display:flex;align-items:flex-start;justify-content:space-between}
.ph-left .ph-title{font-size:20px;font-weight:800;margin-bottom:3px}
.ph-left .ph-sub{font-size:13px;color:var(--text2)}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--navy2);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.kpi-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kpi-val{font-size:28px;font-weight:800;line-height:1;margin-bottom:3px}
.kpi-sub{font-size:11px;color:var(--text3)}
.kpi-bar{height:3px;border-radius:2px;background:var(--border);margin-top:10px;overflow:hidden}
.kpi-fill{height:100%;border-radius:2px}
.kpi-ico{position:absolute;top:14px;right:14px;font-size:20px;opacity:.2}

/* CARD */
.card{background:var(--navy2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:700}
.card-body{padding:18px}
.card-sub{font-size:12px;color:var(--text3)}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:rgba(255,255,255,.03)}
th{text-align:left;padding:9px 14px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:var(--mono);font-size:12px;color:var(--text3)}

/* BADGE */
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-blue{background:rgba(59,130,246,.15);color:#60A5FA}
.b-green{background:rgba(16,185,129,.15);color:#34D399}
.b-red{background:rgba(239,68,68,.15);color:#F87171}
.b-amber{background:rgba(245,158,11,.15);color:#FCD34D}
.b-orange{background:rgba(249,115,22,.15);color:#FB923C}
.b-purple{background:rgba(139,92,246,.15);color:#A78BFA}

/* KONDISI */
.cond-baik{background:rgba(16,185,129,.15);color:#34D399;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.cond-perbaikan{background:rgba(249,115,22,.15);color:#FB923C;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.cond-rusak{background:rgba(239,68,68,.15);color:#F87171;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}

/* CHART */
.charts-row{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:16px}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.bar-group{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bars{display:flex;gap:2px;align-items:flex-end;height:120px}
.bar{width:12px;border-radius:3px 3px 0 0}
.bar-label{font-size:9px;color:var(--text3);font-weight:600;text-align:center;line-height:1.2}
.pie-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;gap:14px}
.pie-ring{position:relative;width:120px;height:120px}
.pie-ring svg{transform:rotate(-90deg)}
.pie-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pie-pct{font-size:22px;font-weight:800;color:var(--green)}
.pie-lbl{font-size:10px;color:var(--text3)}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* STEPS */
.steps{display:flex;gap:6px;margin-bottom:18px;align-items:center}
.step{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);color:var(--text3);background:var(--surface)}
.step.done{color:var(--text2);background:rgba(255,255,255,.06)}
.step.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.step-sep{color:var(--text3);font-size:12px}

/* GRID */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px;background:var(--surface);cursor:pointer;transition:all .12s}
.list-item:hover,.list-item.sel{border-color:var(--accent);background:rgba(59,130,246,.08)}
.li-name{font-size:13px;font-weight:600}
.li-meta{font-size:11px;color:var(--text3);margin-top:2px}

/* FORM INPUT BARANG */
.add-row{display:grid;grid-template-columns:1fr 80px 120px auto auto;gap:8px;align-items:end;padding:12px 14px;background:rgba(59,130,246,.05);border-top:1px solid var(--border)}
.inp-wrap{display:flex;flex-direction:column;gap:3px}
.inp-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.fi-sm{padding:7px 9px;background:var(--navy);border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font);color:var(--text);outline:none;width:100%;transition:border-color .15s}
.fi-sm:focus{border-color:var(--accent)}
.fi-sm:disabled{opacity:.5;cursor:not-allowed}

/* AUTOCOMPLETE */
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:var(--navy2);border:1px solid var(--accent);border-radius:8px;z-index:100;max-height:200px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4);margin-top:2px}
.ac-item{padding:8px 12px;font-size:13px;cursor:pointer;transition:background .1s}
.ac-item:hover{background:rgba(59,130,246,.15);color:var(--accent)}
.ac-item mark{background:transparent;color:var(--accent);font-weight:700}

/* EDIT ROW */
.edit-row{background:rgba(59,130,246,.06) !important}
.edit-fi{padding:4px 8px;background:var(--navy);border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--font);color:var(--text);outline:none}
.edit-fi:focus{border-color:var(--accent)}
.cond-select{padding:4px 8px;background:var(--navy);border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:var(--font);color:var(--text);outline:none;cursor:pointer}
.cond-select:focus{border-color:var(--accent)}

/* PROG */
.prog{height:3px;border-radius:2px;background:var(--border);overflow:hidden;margin-top:6px}
.prog-fill{height:100%;border-radius:2px}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy2);border:1px solid rgba(16,185,129,.4);color:var(--green);padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;animation:slideUp .25s ease;z-index:9999;pointer-events:none}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.empty{text-align:center;padding:40px;color:var(--text3)}
.empty-ico{font-size:32px;margin-bottom:10px}
.empty-txt{font-size:13px;font-weight:600}

/* ACCESS DENIED */
.denied{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:20px;color:#F87171;font-size:13px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:10px}

select option{background:#1E293B;color:#F8FAFC}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">📋</div>
      <div><div class="login-logo-name">SIM-DBR</div><div class="login-logo-sub">Inventaris Barang Ruangan</div></div>
    </div>
    <div class="login-h">Selamat Datang</div>
    <p class="login-sub">Masuk untuk mengelola inventaris aset</p>
    <div class="fg">
      <label>Login Sebagai</label>
      <select class="fi" id="inp-role" onchange="onRoleChange()">
        <option value="superadmin">Super Admin — Bag. Umum</option>
        <optgroup label="Admin Fakultas">
          <option value="admin_rektorat">Admin — Rektorat</option>
          <option value="admin_syariah">Admin — Fak. Syariah</option>
          <option value="admin_febi">Admin — FEBI</option>
          <option value="admin_tarbiyah">Admin — Fak. Tarbiyah</option>
          <option value="admin_ushuludin">Admin — Fak. Ushuludin</option>
          <option value="admin_pascasarjana">Admin — Pascasarjana</option>
          <option value="admin_perpustakaan">Admin — Perpustakaan</option>
          <option value="admin_mahad">Admin — Mahad</option>
        </optgroup>
      </select>
    </div>
    <div class="fg" id="wrap-username">
      <label>Username</label>
      <input class="fi" id="inp-username" placeholder="Username"/>
    </div>
    <div class="fg">
      <label>Password</label>
      <input class="fi" type="password" id="inp-password" placeholder="Password"/>
    </div>
    <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="doLogin()">Masuk →</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;flex-direction:row">
  <div class="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-icon">📋</div>
      <div><div class="sb-brand-name">SIM-DBR</div><div class="sb-brand-ver">v2025</div></div>
    </div>
    <div class="sb-sec">Utama</div>
    <div class="sb-item active" id="nav-dashboard" onclick="nav('dashboard')"><span class="ico">📊</span>Dashboard</div>
    <div id="sb-master-sec" class="sb-sec">Master Data</div>
    <div id="sb-master-item" class="sb-item" onclick="toggleSub('master')"><span class="ico">🗂️</span>Master Data</div>
    <div id="sub-master" style="display:none">
      <div class="sb-sub" id="nav-m-barang" onclick="nav('m-barang')"><span class="sb-dot"></span>Barang</div>
      <div class="sb-sub" id="nav-m-lokasi" onclick="nav('m-lokasi')"><span class="sb-dot"></span>Lokasi</div>
      <div class="sb-sub" id="nav-m-pic" onclick="nav('m-pic')"><span class="sb-dot"></span>PIC / Kasub Bag</div>
      <div class="sb-sub" id="nav-m-bmn" onclick="nav('m-bmn')"><span class="sb-dot"></span>Anggota BMN</div>
      <div class="sb-sub" id="nav-m-user" onclick="nav('m-user')"><span class="sb-dot"></span>Users</div>
    </div>
    <div class="sb-sec">Transaksi</div>
    <div class="sb-item" id="nav-transaksi" onclick="toggleSub('transaksi')"><span class="ico">📝</span>Transaksi</div>
    <div id="sub-transaksi" style="display:none">
      <div class="sb-sub" id="nav-t-input" onclick="nav('t-input')"><span class="sb-dot"></span>Input / Verifikasi</div>
      <div class="sb-sub" id="nav-t-pindah" onclick="nav('t-pindah')"><span class="sb-dot"></span>Pindah Barang</div>
    </div>
    <div class="sb-sec">Laporan</div>
    <div class="sb-item" id="nav-laporan" onclick="nav('laporan')"><span class="ico">📄</span>Laporan DBR</div>
    <div class="sb-bottom">
      <div class="sb-user">
        <div class="sb-av" id="sb-av">A</div>
        <div>
          <div class="sb-uname" id="sb-uname">—</div>
          <div class="sb-urole" id="sb-urole">—</div>
          <div class="sb-unit" id="sb-unit" style="display:none"></div>
        </div>
      </div>
      <button class="btn btn-ghost btn-full btn-sm" style="margin-top:8px" onclick="doLogout()">Keluar</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb"><span class="cur">Dashboard</span></div>
      <div style="display:flex;align-items:center;gap:10px">
        <span id="topbar-date" style="font-size:12px;color:var(--text3);font-family:var(--mono)"></span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>

// ══════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════
const isSuperAdmin = () => currentRole === "superadmin";
const totalOf = (field, filter) => {
  return Object.entries(ITEMS).flatMap(([id,arr])=>{
    const room = LOKASI.find(l=>l.id===+id);
    if(filter && room && room.unit !== filter) return [];
    return arr;
  }).reduce((s,i)=>s+(field==="qty"?i.qty:0),0);
};
const countCond = (cond, unit) => Object.entries(ITEMS).flatMap(([id,arr])=>{
  const room=LOKASI.find(l=>l.id===+id);
  if(unit && room && room.unit!==unit) return [];
  return arr;
}).filter(i=>i.kondisi===cond).reduce((s,i)=>s+i.qty,0);

const roomItems = id => ITEMS[id] || [];
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const fmt = n => n.toLocaleString("id-ID");
const now = () => new Date().toISOString().split("T")[0];

function toast(msg, type="green") {
  const el = document.createElement("div");
  el.className = "toast";
  el.style.borderColor = type==="red" ? "rgba(239,68,68,.4)" : "rgba(16,185,129,.4)";
  el.style.color = type==="red" ? "#F87171" : "#34D399";
  el.innerHTML = (type==="red"?"⚠️":"✅") + " " + msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}

function setBread(items) {
  document.getElementById("breadcrumb").innerHTML = items.map((b,i) =>
    i===items.length-1 ? `<span class="cur">${b}</span>` : `<span>${b}</span> <span style="color:var(--text3)">/</span> `
  ).join("");
}

function condBadge(k) {
  const map = {Baik:"cond-baik",Perbaikan:"cond-perbaikan",Rusak:"cond-rusak"};
  return `<span class="${map[k]||"cond-baik"}">${k}</span>`;
}

function doLogin() {
  const role = document.getElementById("inp-role").value;
  const uname = document.getElementById("inp-username").value || "admin";
  currentRole = role;
  currentUnit = ROLE_UNIT[role];

  // Set user display
  if(isSuperAdmin()) {
    currentUser = USERS_SUPERADMIN[0];
    document.getElementById("sb-uname").textContent = "Bag. Umum";
    document.getElementById("sb-urole").textContent = "Super Admin";
    document.getElementById("sb-unit").style.display = "none";
  } else {
    const adminData = ADMIN_FAKULTAS.find(a=>a.role===role);
    currentUser = adminData || {nama: uname, nip:""};
    document.getElementById("sb-uname").textContent = currentUser.nama.split(",")[0];
    document.getElementById("sb-urole").textContent = "Admin Fakultas";
    document.getElementById("sb-unit").textContent = currentUnit;
    document.getElementById("sb-unit").style.display = "block";
  }
  document.getElementById("sb-av").textContent = (currentUser.nama||uname)[0].toUpperCase();

  // Hide master menu items for admin fakultas
  if(!isSuperAdmin()) {
    ["nav-m-bmn","nav-m-user"].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.style.display = "none";
    });
  } else {
    ["nav-m-bmn","nav-m-user"].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.style.display = "";
    });
  }

  document.getElementById("login-page").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("topbar-date").textContent = new Date().toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
  page = "dashboard"; selGedung=null; selRoom=null;
  render();
}

function doLogout() {
  document.getElementById("app").style.display = "none";
  document.getElementById("login-page").style.display = "flex";
}

function nav(p) {
  page = p; selGedung=null; selRoom=null; addOpen=false; editingId=null;
  document.querySelectorAll(".sb-item").forEach(el=>el.classList.remove("active"));
  document.querySelectorAll(".sb-sub").forEach(el=>el.classList.remove("active"));
  if(p==="dashboard") document.getElementById("nav-dashboard").classList.add("active");
  if(p==="laporan") document.getElementById("nav-laporan").classList.add("active");
  if(p.startsWith("m-")) {
    document.getElementById("sb-master-item").classList.add("active");
    document.getElementById("nav-"+p)?.classList.add("active");
  }
  if(p.startsWith("t-")) {
    document.getElementById("nav-transaksi").classList.add("active");
    document.getElementById("nav-"+p)?.classList.add("active");
  }
  render();
}

function renderDashboard() {

  const gBaik = countCond("Baik", unit);

  const gRusak = countCond("Rusak", unit);

  const barData = (unit ? [unit] : UNITS).map(u => {
    const ids = LOKASI.filter(l=>l.unit===u).map(l=>l.id);
    const q = ids.reduce((s,id)=>s+roomItems(id).reduce((a,i)=>a+i.qty,0),0);
    const b = ids.reduce((s,id)=>s+roomItems(id).filter(i=>i.kondisi==="Baik").reduce((a,i)=>a+i.qty,0),0);
    const p = ids.reduce((s,id)=>s+roomItems(id).filter(i=>i.kondisi==="Perbaikan").reduce((a,i)=>a+i.qty,0),0);
    const r = ids.reduce((s,id)=>s+roomItems(id).filter(i=>i.kondisi==="Rusak").reduce((a,i)=>a+i.qty,0),0);
    return {name:u.replace("Fak. ","").replace("Fakultas ",""),q,b,p,r};
  }).filter(d=>d.q>0);
  const maxQ = Math.max(...barData.map(d=>d.q),1);
  const bars = barData.map(d=>`
    <div class="bar-group">
      <div class="bars">
        <div class="bar" style="height:${Math.round(d.b/maxQ*110)}px;background:#10B981" title="Baik: ${d.b}"></div>
        <div class="bar" style="height:${Math.round(d.p/maxQ*110)}px;background:#F97316" title="Perbaikan: ${d.p}"></div>
        <div class="bar" style="height:${Math.round(d.r/maxQ*110)}px;background:#EF4444" title="Rusak: ${d.r}"></div>
      </div>
      <div class="bar-label">${d.name}</div>
    </div>`).join("");

  const circ=2*Math.PI*54, pctB=pct(gBaik,gQty);
  return `
  <div class="ph">
    <div class="ph-left">
      <div class="ph-title">Dashboard ${unit?`— ${unit}`:""}</div>
      <div class="ph-sub">Ringkasan inventaris aset · ${new Date().getFullYear()}</div>

  </div>
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-ico">📦</div><div class="kpi-label">Total Aset</div><div class="kpi-val" style="color:#60A5FA">${fmt(gQty)}</div><div class="kpi-sub">${Object.values(ITEMS).flat().length} baris data</div><div class="kpi-bar"><div class="kpi-fill" style="width:100%;background:#3B82F6"></div></div></div>
    <div class="kpi"><div class="kpi-ico">✅</div><div class="kpi-label">Kondisi Baik</div><div class="kpi-val" style="color:#34D399">${fmt(gBaik)}</div><div class="kpi-sub">${pct(gBaik,gQty)}% dari total</div><div class="kpi-bar"><div class="kpi-fill" style="width:${pct(gBaik,gQty)}%;background:#10B981"></div></div></div>
    <div class="kpi"><div class="kpi-ico">🔧</div><div class="kpi-label">Perbaikan</div><div class="kpi-val" style="color:#FB923C">${fmt(gServis)}</div><div class="kpi-sub">${pct(gServis,gQty)}% sedang servis</div><div class="kpi-bar"><div class="kpi-fill" style="width:${pct(gServis,gQty)}%;background:#F97316"></div></div></div>
    <div class="kpi"><div class="kpi-ico">⚠️</div><div class="kpi-label">Rusak</div><div class="kpi-val" style="color:#F87171">${fmt(gRusak)}</div><div class="kpi-sub">${pct(gRusak,gQty)}% perlu tindakan</div><div class="kpi-bar"><div class="kpi-fill" style="width:${pct(gRusak,gQty)}%;background:#EF4444"></div></div></div>
  </div>
  <div class="charts-row">
    <div class="card">
      <div class="card-head"><div class="card-title">Distribusi Aset per Unit</div>
        <div style="display:flex;gap:10px">
          ${[["#10B981","Baik"],["#F97316","Perbaikan"],["#EF4444","Rusak"]].map(([c,l])=>`<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)"><span style="width:8px;height:8px;border-radius:2px;background:${c};display:inline-block"></span>${l}</span>`).join("")}
        </div>
      </div>
      <div class="card-body"><div class="bar-chart">${bars||'<div class="empty"><div class="empty-ico">📊</div><div class="empty-txt">Belum ada data</div></div>'}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">Kondisi Keseluruhan</div></div>
      <div class="card-body">
        <div class="pie-wrap">
          <div class="pie-ring">
            <svg width="120" height="120" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="12"/>
              <circle cx="60" cy="60" r="54" fill="none" stroke="#10B981" stroke-width="12" stroke-dasharray="${circ*pctB/100} ${circ}" stroke-linecap="round"/>
            </svg>
            <div class="pie-center"><div class="pie-pct">${pctB}%</div><div class="pie-lbl">Baik</div></div>
          </div>
          <div class="legend">
            <div class="leg-item"><div class="leg-dot" style="background:#10B981"></div>${fmt(gBaik)} Baik</div>
            <div class="leg-item"><div class="leg-dot" style="background:#F97316"></div>${fmt(gServis)} Perbaikan</div>
            <div class="leg-item"><div class="leg-dot" style="background:#EF4444"></div>${fmt(gRusak)} Rusak</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-head"><div class="card-title">Rekapitulasi per Unit</div></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Unit</th><th>Ruangan Terisi</th><th>Total Aset</th><th>Baik</th><th>Perbaikan</th><th>Rusak</th><th>% Baik</th></tr></thead>
      <tbody>${(unit?[unit]:UNITS).map(u=>{
        const ids=LOKASI.filter(l=>l.unit===u).map(l=>l.id);

        const b=ids.reduce((s,id)=>s+roomItems(id).filter(i=>i.kondisi==="Baik").reduce((a,i)=>a+i.qty,0),0);
        const p2=ids.reduce((s,id)=>s+roomItems(id).filter(i=>i.kondisi==="Perbaikan").reduce((a,i)=>a+i.qty,0),0);
        const r=ids.reduce((s,id)=>s+roomItems(id).filter(i=>i.kondisi==="Rusak").reduce((a,i)=>a+i.qty,0),0);
        const p=pct(b,q);
        const terisi=ids.filter(id=>roomItems(id).length>0).length;
        return `<tr>
          <td style="font-weight:700">${u}</td>
          <td><span class="badge b-blue">${terisi} / ${ids.length}</span></td>
          <td style="font-weight:700">${fmt(q)}</td>

    </table></div>
  </div>`;
}

// ══════════════════════════════════════════════════════
// INPUT / VERIFIKASI — with autocomplete + edit
// ══════════════════════════════════════════════════════
function renderInput() {
  setBread(["Transaksi","Input / Verifikasi"]);
  const gedungs = [...new Set(
    LOKASI.filter(l => !currentUnit || l.unit===currentUnit).map(l=>l.gedung)
  )];
  const rooms = selGedung ? LOKASI.filter(l=>l.gedung===selGedung && (!currentUnit||l.unit===currentUnit)) : [];

  if(selRoom) {
    const ri = roomItems(selRoom.id);
    const tQ = ri.reduce((s,i)=>s+i.qty,0);
    const tB = ri.filter(i=>i.kondisi==="Baik").reduce((s,i)=>s+i.qty,0);
    const tP = ri.filter(i=>i.kondisi==="Perbaikan").reduce((s,i)=>s+i.qty,0);
    const tR = ri.filter(i=>i.kondisi==="Rusak").reduce((s,i)=>s+i.qty,0);
    const pic = PICS.find(p=>p.unit===selRoom.unit);

    const rows = ri.map(item => {
      if(editingId === item.id) {
        return `<tr class="edit-row">
          <td class="mono">${item.id}</td>
          <td style="font-weight:600">${item.nama}</td>
          <td><input class="edit-fi" type="number" id="edit-qty" value="${item.qty}" min="1" style="width:70px"/></td>
          <td>
            <select class="cond-select" id="edit-cond">
              ${["Baik","Perbaikan","Rusak"].map(c=>`<option ${c===item.kondisi?"selected":""}>${c}</option>`).join("")}
            </select>
          </td>
          <td class="mono" style="font-size:11px">${item.updatedBy}</td>
          <td class="mono" style="font-size:11px">${item.updatedAt}</td>
          <td>
            <div style="display:flex;gap:5px">
              <button class="btn btn-green btn-sm btn-icon" onclick="saveEdit(${selRoom.id},${item.id})">💾</button>
              <button class="btn btn-ghost btn-sm btn-icon" onclick="cancelEdit()">✕</button>
            </div>
          </td>
        </tr>`;
      }
      return `<tr>
        <td class="mono">${item.id}</td>
        <td style="font-weight:600">${item.nama}</td>
        <td style="text-align:center;font-weight:700">${item.qty}</td>
        <td>${condBadge(item.kondisi)}</td>
        <td class="mono" style="font-size:11px">${item.updatedBy}</td>
        <td class="mono" style="font-size:11px">${item.updatedAt}</td>
        <td>
          <div style="display:flex;gap:5px">
            <button class="btn btn-ghost btn-sm btn-icon" onclick="startEdit(${item.id})">✏️</button>
            <button class="btn btn-red btn-sm btn-icon" onclick="deleteItem(${selRoom.id},${item.id})">🗑</button>
          </div>
        </td>
      </tr>`;
    }).join("");

    const suggestions = newItem.nama.length>=1
      ? MASTER_BARANG.filter(b=>b.toLowerCase().includes(newItem.nama.toLowerCase())).slice(0,8)
      : [];

    return `
    <div class="ph">
      <div class="ph-left">
        <div class="ph-title">📦 ${selRoom.nama}</div>
        <div class="ph-sub">${selRoom.gedung} · ${selRoom.lantai} · ${selRoom.unit}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="selRoom=null;render()">← Kembali</button>
        <button class="btn btn-primary btn-sm" onclick="toast('Data berhasil disimpan!')">💾 Simpan</button>
      </div>
    </div>

    <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)">
      <div class="kpi"><div class="kpi-label">Total Qty</div><div class="kpi-val" style="color:#60A5FA;font-size:24px">${tQ}</div><div class="kpi-sub">${ri.length} baris</div></div>
      <div class="kpi"><div class="kpi-label">Baik</div><div class="kpi-val" style="color:#34D399;font-size:24px">${tB}</div><div class="kpi-bar"><div class="kpi-fill" style="width:${pct(tB,tQ)}%;background:#10B981"></div></div></div>
      <div class="kpi"><div class="kpi-label">Perbaikan</div><div class="kpi-val" style="color:#FB923C;font-size:24px">${tP}</div><div class="kpi-bar"><div class="kpi-fill" style="width:${pct(tP,tQ)}%;background:#F97316"></div></div></div>
      <div class="kpi"><div class="kpi-label">Rusak</div><div class="kpi-val" style="color:#F87171;font-size:24px">${tR}</div><div class="kpi-bar"><div class="kpi-fill" style="width:${pct(tR,tQ)}%;background:#EF4444"></div></div></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">Daftar Barang</div>
        <button class="btn btn-ghost btn-sm" onclick="addOpen=!addOpen;render()">
          ${addOpen?"✕ Tutup":"+ Tambah Barang"}
        </button>
      </div>

      ${addOpen ? `
      <div class="add-row">
        <div class="inp-wrap" style="position:relative">
          <div class="inp-lbl">Nama Barang</div>
          <div class="ac-wrap">
            <input class="fi-sm" id="ac-input" placeholder="Cari nama barang..." value="${newItem.nama}"
              oninput="onAcInput(this.value)" autocomplete="off"/>
            ${suggestions.length>0?`
            <div class="ac-list" id="ac-list">
              ${suggestions.map(s=>`<div class="ac-item" onclick="selectAc('${s.replace(/'/g,"\\'")}')">
                ${s.replace(new RegExp(newItem.nama.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`)}
              </div>`).join("")}
            </div>`:""}
          </div>
        </div>
        <div class="inp-wrap">
          <div class="inp-lbl">Qty</div>
          <input class="fi-sm" type="number" id="add-qty" value="${newItem.qty}" min="1" style="width:80px"/>
        </div>
        <div class="inp-wrap">
          <div class="inp-lbl">Kondisi</div>
          <select class="fi-sm" id="add-cond">
            ${["Baik","Perbaikan","Rusak"].map(c=>`<option ${c===newItem.kondisi?"selected":""}>${c}</option>`).join("")}
          </select>
        </div>
        <div class="inp-wrap">
          <div class="inp-lbl" style="opacity:0">_</div>
          <button class="btn btn-green btn-sm" onclick="doAdd(${selRoom.id})">+ Simpan</button>
        </div>
        <div class="inp-wrap">
          <div class="inp-lbl" style="opacity:0">_</div>
          <button class="btn btn-ghost btn-sm" onclick="addOpen=false;newItem={nama:'',qty:1,kondisi:'Baik'};render()">Batal</button>
        </div>
      </div>` : ""}

      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>Nama Barang</th><th>Qty</th><th>Kondisi</th><th>Diinput Oleh</th><th>Tgl Update</th><th>Aksi</th></tr></thead>
        <tbody>${ri.length===0
          ? `<tr><td colspan="7"><div class="empty"><div class="empty-ico">📦</div><div class="empty-txt">Belum ada barang. Klik "+ Tambah Barang" untuk mulai.</div></div></td></tr>`
          : rows}
        </tbody>
      </table></div>

      <div style="padding:12px 18px;border-top:1px solid var(--border);font-size:12px;color:var(--text3)">
        PIC: <strong style="color:var(--text)">${pic?pic.nama:"—"}</strong>${pic?` · NIP ${pic.nip} · ${pic.jabatan}`:""}
      </div>
    </div>`;
  }

  // Room selection
  return `
  <div class="ph"><div class="ph-left"><div class="ph-title">Input / Verifikasi Barang</div>
    <div class="ph-sub">Pilih lokasi${currentUnit?" di "+currentUnit:""}</div></div></div>
  <div class="steps">
    <div class="step ${!selGedung?"cur":"done"}">1. Pilih Gedung</div><div class="step-sep">›</div>
    <div class="step ${selGedung?"cur":""}">2. Pilih Ruangan</div><div class="step-sep">›</div>
    <div class="step">3. Kelola Barang</div>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="card-head"><div class="card-title">🏢 Gedung</div></div>
      <div class="card-body" style="padding:10px">
        ${gedungs.map(g=>{
          const cnt=LOKASI.filter(l=>l.gedung===g&&(!currentUnit||l.unit===currentUnit)).length;
          return `<div class="list-item ${selGedung===g?"sel":""}" onclick="selGedung='${g}';render()">
            <div><div class="li-name">${g}</div><div class="li-meta">${cnt} ruangan</div></div>
            ${selGedung===g?'<span style="color:var(--accent)">›</span>':""}
          </div>`;
        }).join("")}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">🚪 Ruangan${selGedung?" — "+selGedung:""}</div></div>
      <div class="card-body" style="padding:10px">
        ${!selGedung
          ? `<div class="empty"><div class="empty-ico">👈</div><div class="empty-txt">Pilih gedung</div></div>`
          : rooms.map(r=>{
              const ri=roomItems(r.id);
              const q=ri.reduce((s,i)=>s+i.qty,0);
              const hasRusak=ri.some(i=>i.kondisi==="Rusak");
              const hasPerbaikan=ri.some(i=>i.kondisi==="Perbaikan");
              return `<div class="list-item" onclick="selRoom=${JSON.stringify(r).replace(/"/g,'&quot;')};editingId=null;addOpen=false;render()">
                <div><div class="li-name">${r.nama}</div><div class="li-meta">${r.lantai}</div></div>
                <div style="display:flex;gap:5px">
                  <span class="badge b-blue">${q} unit</span>
                  ${hasRusak?`<span class="badge b-red">Rusak</span>`:""}
                  ${hasPerbaikan?`<span class="badge b-orange">Servis</span>`:""}
                </div>
              </div>`;
            }).join("")}
      </div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════
// AUTOCOMPLETE ACTIONS
// ══════════════════════════════════════════════════════
function onAcInput(val) {
  newItem.nama = val;
  render();
  // refocus
  setTimeout(()=>{
    const el=document.getElementById("ac-input");
    if(el){el.focus();el.value=val;el.setSelectionRange(val.length,val.length);}
  },10);
}
function selectAc(val) {
  newItem.nama = val;
  addOpen = true;
  render();
  setTimeout(()=>{
    const el=document.getElementById("add-qty");
    if(el) el.focus();
  },50);
}

// ══════════════════════════════════════════════════════
// CRUD ITEMS
// ══════════════════════════════════════════════════════
function doAdd(roomId) {
  const nama = document.getElementById("ac-input")?.value || newItem.nama;
  const qty = +document.getElementById("add-qty")?.value || 1;
  const kondisi = document.getElementById("add-cond")?.value || "Baik";
  if(!nama.trim()) { toast("Nama barang harus diisi!", "red"); return; }
  if(!ITEMS[roomId]) ITEMS[roomId]=[];
  ITEMS[roomId].push({id:Date.now(), nama, qty, kondisi, updatedBy: currentUser.nama.split(",")[0], updatedAt: now()});
  newItem = {nama:"", qty:1, kondisi:"Baik"};
  addOpen = false;
  render();
  toast("Barang berhasil ditambahkan!");
}

function startEdit(itemId) {
  editingId = itemId;
  render();
}
function cancelEdit() {
  editingId = null;
  render();
}
function saveEdit(roomId, itemId) {
  const qty = +document.getElementById("edit-qty")?.value || 1;
  const kondisi = document.getElementById("edit-cond")?.value || "Baik";
  ITEMS[roomId] = ITEMS[roomId].map(i =>
    i.id===itemId ? {...i, qty, kondisi, updatedBy: currentUser.nama.split(",")[0], updatedAt: now()} : i
  );
  editingId = null;
  render();
  toast("Data berhasil diperbarui!");
}
function deleteItem(roomId, itemId) {
  ITEMS[roomId] = (ITEMS[roomId]||[]).filter(i=>i.id!==itemId);
  render();
  toast("Barang dihapus.");
}

// ══════════════════════════════════════════════════════
// PINDAH BARANG

// ── API CONFIG ───────────────────────────────────────────────────────────────
const API_URL = "https://script.google.com/macros/s/AKfycbwY-e5LREglUWOGmIZoclhpJE49TD8B3nsD6Fznmt1iN-Zac71gFS24W7vvvQh0u0s11g/exec";
let AUTH_TOKEN = localStorage.getItem("simdbr_token") || "";

async function apiGet(action, params={}) {
  const qs = new URLSearchParams({action, token:AUTH_TOKEN, ...params});
  const res = await fetch(API_URL + "?" + qs);
  const json = await res.json();
  if(json.status==="error") throw new Error(json.message);
  return json.data;
}

async function apiPost(action, body={}) {
  const res = await fetch(API_URL, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action, token:AUTH_TOKEN, ...body})
  });
  const json = await res.json();
  if(json.status==="error") throw new Error(json.message);
  return json.data;
}

window.selRoom = null;
window.editingId = null;
