<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SIM-DBR — Sistem Inventaris Barang Ruangan</title>
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F172A;--navy2:#1E293B;--navy3:#334155;
  --accent:#3B82F6;--accent2:#1D4ED8;
  --green:#10B981;--red:#EF4444;--amber:#F59E0B;--purple:#8B5CF6;--orange:#F97316;
  --text:#F8FAFC;--text2:#94A3B8;--text3:#64748B;
  --border:rgba(255,255,255,0.08);--surface:rgba(255,255,255,0.04);
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
/* ── LIGHT MODE ── */
body.light{
  --navy:#F1F5F9;--navy2:#FFFFFF;--navy3:#E2E8F0;
  --accent:#2563EB;--accent2:#1D4ED8;
  --green:#059669;--red:#DC2626;--amber:#D97706;--purple:#7C3AED;--orange:#EA580C;
  --text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --border:rgba(0,0,0,0.08);--surface:rgba(0,0,0,0.03);
}
body.light .login-box{box-shadow:0 8px 32px rgba(0,0,0,.12)}
body.light .fi{background:#F8FAFC;color:#0F172A}
body.light .fi-sm{background:#F8FAFC;color:#0F172A}
body.light .ac-list{background:#FFFFFF;border-color:#2563EB}
body.light .ac-item:hover{background:rgba(37,99,235,.08)}
body.light .cond-select{background:#F8FAFC;color:#0F172A}
body.light .edit-fi{background:#F8FAFC;color:#0F172A}
body.light th{color:#64748B}
body.light .sb-brand-ver{color:#94A3B8}
body.light #add-panel > div:last-child{background:#FFFFFF;border-top-color:#2563EB}
body.light .toast{background:#FFFFFF;color:#059669}
html,body{height:100%;background:var(--navy);color:var(--text);font-family:var(--font);font-size:14px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--navy3);border-radius:4px}

/* LOGIN */
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(59,130,246,.15),transparent 70%)}
.login-box{width:380px;background:var(--navy2);border:1px solid var(--border);border-radius:16px;padding:40px}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.login-logo-icon{width:36px;height:36px;border-radius:9px;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:18px}
.login-logo-name{font-size:18px;font-weight:800}
.login-logo-sub{font-size:11px;color:var(--text3)}
.login-h{font-size:22px;font-weight:800;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.fi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;font-family:var(--font);color:var(--text);outline:none;width:100%;transition:border-color .15s}
.fi:focus{border-color:var(--accent)}
.fi option{background:#1E293B}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent2);color:#fff}.btn-primary:hover{background:var(--accent)}
.btn-full{width:100%}
.btn-ghost{background:var(--surface);color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:rgba(255,255,255,.08);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-green{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3)}.btn-green:hover{background:rgba(16,185,129,.25)}
.btn-red{background:rgba(239,68,68,.12);color:#F87171;border:1px solid rgba(239,68,68,.3)}.btn-red:hover{background:rgba(239,68,68,.2)}
.btn-icon{padding:5px 8px;font-size:13px}

/* SHELL */
#app{display:none;height:100vh;overflow:hidden;flex-direction:row}

/* SIDEBAR */
.sidebar{
  width:220px;min-width:220px;background:var(--navy2);
  border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;
  transition:width .25s ease,min-width .25s ease,transform .25s ease;
  position:relative;z-index:50;flex-shrink:0;
}
.sidebar.collapsed{width:0;min-width:0;overflow:hidden}
.sb-text{transition:opacity .2s ease}
.sidebar.collapsed .sb-text{opacity:0;pointer-events:none}
/* Mobile overlay */
@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:150;transform:translateX(0)}
  .sidebar.collapsed{transform:translateX(-220px);width:220px;min-width:220px}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:149}
  .sidebar-overlay.visible{display:block}
  .main{width:100%}
}
.sb-brand{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.sb-brand-icon{width:30px;height:30px;border-radius:7px;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.sb-brand-name{font-size:14px;font-weight:800;line-height:1}
.sb-brand-ver{font-size:10px;color:var(--text3);font-family:var(--mono)}
.sb-sec{padding:16px 12px 6px;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:9px;margin:1px 6px;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .12s}
.sb-item:hover{background:var(--surface);color:var(--text)}
.sb-item.active{background:rgba(59,130,246,.12);color:var(--accent);font-weight:600}
.sb-item .ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sb-sub{display:flex;align-items:center;gap:8px;margin:1px 6px 1px 28px;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;transition:all .12s}
.sb-sub:hover{background:var(--surface);color:var(--text2)}
.sb-sub.active{color:var(--accent);font-weight:600}
.sb-dot{width:4px;height:4px;border-radius:50%;background:currentColor;flex-shrink:0}
.sb-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface)}
.sb-av{width:30px;height:30px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:700}
.sb-urole{font-size:10px;color:var(--text3)}
.sb-unit{font-size:10px;color:var(--amber);font-weight:600;margin-top:1px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--navy2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text3)}
.breadcrumb .cur{color:var(--text);font-weight:600}
.content{flex:1;overflow-y:auto;padding:24px 28px}

/* PAGE */
.ph{margin-bottom:22px;display:flex;align-items:flex-start;justify-content:space-between}
.ph-left .ph-title{font-size:20px;font-weight:800;margin-bottom:3px}
.ph-left .ph-sub{font-size:13px;color:var(--text2)}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--navy2);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.kpi-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kpi-val{font-size:28px;font-weight:800;line-height:1;margin-bottom:3px}
.kpi-sub{font-size:11px;color:var(--text3)}
.kpi-bar{height:3px;border-radius:2px;background:var(--border);margin-top:10px;overflow:hidden}
.kpi-fill{height:100%;border-radius:2px}
.kpi-ico{position:absolute;top:14px;right:14px;font-size:20px;opacity:.2}

/* CARD */
.card{background:var(--navy2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:700}
.card-body{padding:18px}
.card-sub{font-size:12px;color:var(--text3)}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:rgba(255,255,255,.03)}
th{text-align:left;padding:9px 14px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:var(--mono);font-size:12px;color:var(--text3)}

/* BADGE */
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-blue{background:rgba(59,130,246,.15);color:#60A5FA}
.b-green{background:rgba(16,185,129,.15);color:#34D399}
.b-red{background:rgba(239,68,68,.15);color:#F87171}
.b-amber{background:rgba(245,158,11,.15);color:#FCD34D}
.b-orange{background:rgba(249,115,22,.15);color:#FB923C}
.b-purple{background:rgba(139,92,246,.15);color:#A78BFA}

/* KONDISI */
.cond-baik{background:rgba(16,185,129,.15);color:#34D399;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.cond-perbaikan{background:rgba(249,115,22,.15);color:#FB923C;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.cond-rusak{background:rgba(239,68,68,.15);color:#F87171;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}

/* CHART */
.charts-row{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:16px}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.bar-group{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bars{display:flex;gap:2px;align-items:flex-end;height:120px}
.bar{width:12px;border-radius:3px 3px 0 0}
.bar-label{font-size:9px;color:var(--text3);font-weight:600;text-align:center;line-height:1.2}
.pie-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;gap:14px}
.pie-ring{position:relative;width:120px;height:120px}
.pie-ring svg{transform:rotate(-90deg)}
.pie-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pie-pct{font-size:22px;font-weight:800;color:var(--green)}
.pie-lbl{font-size:10px;color:var(--text3)}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* STEPS */
.steps{display:flex;gap:6px;margin-bottom:18px;align-items:center}
.step{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);color:var(--text3);background:var(--surface)}
.step.done{color:var(--text2);background:rgba(255,255,255,.06)}
.step.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.step-sep{color:var(--text3);font-size:12px}

/* GRID */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px;background:var(--surface);cursor:pointer;transition:all .12s}
.list-item:hover,.list-item.sel{border-color:var(--accent);background:rgba(59,130,246,.08)}
.li-name{font-size:13px;font-weight:600}
.li-meta{font-size:11px;color:var(--text3);margin-top:2px}

/* FORM INPUT BARANG */
.add-row{display:grid;grid-template-columns:1fr 80px 120px auto auto;gap:8px;align-items:end;padding:12px 14px;background:rgba(59,130,246,.05);border-top:1px solid var(--border)}
.inp-wrap{display:flex;flex-direction:column;gap:3px}
.inp-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.fi-sm{padding:7px 9px;background:var(--navy);border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font);color:var(--text);outline:none;width:100%;transition:border-color .15s}
.fi-sm:focus{border-color:var(--accent)}
.fi-sm:disabled{opacity:.5;cursor:not-allowed}

/* AUTOCOMPLETE */
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:var(--navy2);border:1px solid var(--accent);border-radius:8px;z-index:100;max-height:200px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4);margin-top:2px}
.ac-item{padding:8px 12px;font-size:13px;cursor:pointer;transition:background .1s}
.ac-item:hover{background:rgba(59,130,246,.15);color:var(--accent)}
.ac-item mark{background:transparent;color:var(--accent);font-weight:700}

/* EDIT ROW */
.edit-row{background:rgba(59,130,246,.06) !important}
.edit-fi{padding:4px 8px;background:var(--navy);border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--font);color:var(--text);outline:none}
.edit-fi:focus{border-color:var(--accent)}
.cond-select{padding:4px 8px;background:var(--navy);border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:var(--font);color:var(--text);outline:none;cursor:pointer}
.cond-select:focus{border-color:var(--accent)}

/* PROG */
.prog{height:3px;border-radius:2px;background:var(--border);overflow:hidden;margin-top:6px}
.prog-fill{height:100%;border-radius:2px}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy2);border:1px solid rgba(16,185,129,.4);color:var(--green);padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;animation:slideUp .25s ease;z-index:9999;pointer-events:none}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.empty{text-align:center;padding:40px;color:var(--text3)}
.empty-ico{font-size:32px;margin-bottom:10px}
.empty-txt{font-size:13px;font-weight:600}

/* ACCESS DENIED */
.denied{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:20px;color:#F87171;font-size:13px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:10px}

select option{background:#1E293B;color:#F8FAFC}

/* ── MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;animation:fadeInFast .15s}
.modal{background:var(--navy2);border:1px solid var(--border);border-radius:16px;padding:28px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.5);animation:slideUp .2s ease}
.modal-title{font-size:17px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:0;line-height:1}
.modal-close:hover{color:var(--text)}
.modal .fg{margin-bottom:14px}
.modal .fg label{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.modal .fg input,.modal .fg select,.modal .fg textarea{width:100%;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);color:var(--text);outline:none}
.modal .fg input:focus,.modal .fg select:focus{border-color:var(--accent)}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* ── SEARCH BAR ── */
.search-bar{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface)}
.search-input{flex:1;padding:8px 12px;background:var(--navy);border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:var(--font);color:var(--text);outline:none}
.search-input:focus{border-color:var(--accent)}

/* ── ADD PANEL (modal center) ── */
#add-panel .modal{width:420px}
body.light .modal{background:#FFFFFF}
body.light .modal .fg input,body.light .modal .fg select{background:#F8FAFC;color:#0F172A}

@keyframes slideUpPanel{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
/* ── SMOOTH TRANSITIONS ── */
.content{transition:opacity .15s ease}
.content.fading{opacity:0}
.card{animation:fadeIn .2s ease}
.kpi{animation:fadeIn .25s ease}
.list-item{transition:border-color .12s,background .12s,transform .1s}
.list-item:hover{transform:translateX(2px)}
.sb-item{transition:background .12s,color .12s}
.btn{transition:background .15s,transform .12s,box-shadow .15s,opacity .12s}
.btn:active{transform:scale(.97)}
.badge{transition:background .15s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInFast{from{opacity:0}to{opacity:1}}
.add-form{animation:fadeIn .2s ease}
.ac-list{animation:fadeIn .15s ease}
.toast{animation:slideUp .25s cubic-bezier(.34,1.56,.64,1)}
table tbody tr{animation:fadeInFast .15s ease}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">📋</div>
      <div><div class="login-logo-name">SIM-DBR</div><div class="login-logo-sub">Inventaris Barang Ruangan</div></div>
    </div>
    <div class="login-h">Selamat Datang</div>
    <p class="login-sub">Masuk untuk mengelola inventaris aset</p>

    <div class="fg" id="wrap-username">
      <label>Username</label>
      <input class="fi" id="inp-username" placeholder="Username"/>
    </div>
    <div class="fg">
      <label>Password</label>
      <input class="fi" type="password" id="inp-password" placeholder="Password"/>
    </div>
    <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="doLogin()">Masuk →</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;flex-direction:row">
  <div class="sidebar">
    <div class="sb-brand" style="justify-content:space-between">
      <div style="display:flex;align-items:center;gap:9px">
        <div class="sb-brand-icon">📋</div>
        <div class="sb-text"><div class="sb-brand-name">SIM-DBR</div><div class="sb-brand-ver">v2025</div></div>
      </div>
    </div>
    <div class="sb-sec">Utama</div>
    <div class="sb-item active" id="nav-dashboard" onclick="nav('dashboard')"><span class="ico">📊</span><span class="sb-text">Dashboard</span></div>
    <div id="sb-master-sec" class="sb-sec">Master Data</div>
    <div id="sb-master-item" class="sb-item" onclick="toggleSub('master')"><span class="ico">🗂️</span>Master Data</div>
    <div id="sub-master" style="display:none">
      <div class="sb-sub" id="nav-m-barang" onclick="nav('m-barang')"><span class="sb-dot"></span>Barang</div>
      <div class="sb-sub" id="nav-m-lokasi" onclick="nav('m-lokasi')"><span class="sb-dot"></span>Lokasi</div>
      <div class="sb-sub" id="nav-m-pic" onclick="nav('m-pic')"><span class="sb-dot"></span>PIC / Kasub Bag</div>
            <div class="sb-sub" id="nav-m-user" onclick="nav('m-user')"><span class="sb-dot"></span>Users</div>
    </div>
    <div class="sb-sec">DBR</div>
    <div class="sb-item" id="nav-dbr" onclick="toggleSub('dbr')"><span class="ico">📝</span><span class="sb-text">DBR</span></div>
    <div id="sub-dbr" style="display:none">
      <div class="sb-sub" id="nav-t-input" onclick="nav('t-input')"><span class="sb-dot"></span>Input / Verifikasi</div>
      <div class="sb-sub" id="nav-t-pindah" onclick="nav('t-pindah')"><span class="sb-dot"></span>Pindah Barang</div>
    </div>

// ── SESSION (persist ke localStorage) ───────────────────────
function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem("simdbr_session") || "null");
    if (s && s.currentRole) return s;
  } catch(_) {}
  return null;
}
function saveSession() {
  localStorage.setItem("simdbr_session", JSON.stringify({
    currentRole, currentUnit, currentUser, page
  }));
  
}
function clearSession() {
  localStorage.removeItem("simdbr_session");
  localStorage.removeItem("simdbr_token");
  
}

const _sess = loadSession();
let currentRole = _sess ? _sess.currentRole : null;
let currentUnit = _sess ? _sess.currentUnit : null;
let currentUser = _sess ? _sess.currentUser : null;
let page        = _sess ? (_sess.page || "dashboard") : "dashboard";

// UTILS
// ══════════════════════════════════════════════════════
const isSuperAdmin = () => currentRole === "superadmin";
const totalOf = (field, filter) => {
  return Object.entries(ITEMS).flatMap(([id,arr])=>{
    const room = LOKASI.find(l=>l.id===+id);
    if(filter && room && room.unit !== filter) return [];
    return arr;
  }).reduce((s,i)=>s+(field==="qty"?i.qty:0),0);
};
const countCond = (cond, unit) => Object.entries(ITEMS).flatMap(([id,arr])=>{
  const room=LOKASI.find(l=>l.id===+id);
  if(unit && room && room.unit!==unit) return [];
  return arr;
}).filter(i=>i.kondisi===cond).reduce((s,i)=>s+i.qty,0);

const roomItems = id => ITEMS[id] || [];
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const fmt = n => n.toLocaleString("id-ID");
const now = () => new Date().toISOString().split("T")[0];

function toast(msg, type="green") {
  const el = document.createElement("div");
  el.className = "toast";
  el.style.borderColor = type==="red" ? "rgba(239,68,68,.4)" : "rgba(16,185,129,.4)";
  el.style.color = type==="red" ? "#F87171" : "#34D399";
  el.innerHTML = (type==="red"?"⚠️":"✅") + " " + msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}

function setBread(items) {
  document.getElementById("breadcrumb").innerHTML = items.map((b,i) =>
    i===items.length-1 ? `<span class="cur">${b}</span>` : `<span>${b}</span> <span style="color:var(--text3)">/</span> `
  ).join("");
}

function condBadge(k) {

  return `<span class="${map[k]||"cond-baik"}">${k}</span>`;
}

async function doLogin() {
  const username = document.getElementById("inp-username").value.trim();
  const password = document.getElementById("inp-password").value;
  if (!username || !password) { showLoginError("Username dan password wajib diisi"); return; }

  const btn = document.querySelector(".login-box .btn-primary");
  if (btn) { btn.textContent = "Memuat..."; btn.disabled = true; }

  try {
    const user = await sbLogin(username, password);
    currentRole = user.role;
    currentUnit = (user.unit === "Bagian Umum") ? null : user.unit;
    currentUser = user;
    applyUserUI();
    document.getElementById("login-page").style.display = "none";
    document.getElementById("app").style.display = "flex";
    document.getElementById("topbar-date").textContent = new Date().toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
    page = "dashboard"; selGedung=null; selRoom=null;
    saveSession();
    render();
    loadMasterData();
  } catch(e) {
    showLoginError(e.message || "Login gagal");
  } finally {
    if (btn) { btn.textContent = "Masuk →"; btn.disabled = false; }
  }
}

function showLoginError(msg) {
  let el = document.getElementById("login-error");
  if (!el) {
    el = document.createElement("div");
    el.id = "login-error";
    el.style.cssText = "background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#F87171;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;";
    document.querySelector(".login-box .btn-primary").before(el);
  }
  el.textContent = "⚠️ " + msg;
  setTimeout(() => el && (el.textContent = ""), 4000);
}

function doLogout() {
  clearSession();
  currentRole = null; currentUnit = null; currentUser = null;
  document.getElementById("app").style.display = "none";
  document.getElementById("login-page").style.display = "flex";
}

// ══════════════════════════════════════════════════════
// NAV
// ══════════════════════════════════════════════════════
function nav(p) {
  if(page === p) return; // no re-render kalau sama
  page = p; selGedung=null; selRoom=null; addOpen=false; editingId=null;
  document.querySelectorAll(".sb-item").forEach(el=>el.classList.remove("active"));
  document.querySelectorAll(".sb-sub").forEach(el=>el.classList.remove("active"));
  if(p==="dashboard") document.getElementById("nav-dashboard").classList.add("active");
  if(p==="laporan") document.getElementById("nav-laporan").classList.add("active");
  if(p.startsWith("m-")) {
    document.getElementById("sb-master-item").classList.add("active");
    document.getElementById("nav-"+p)?.classList.add("active");
  }
  if(p.startsWith("t-")) {
    document.getElementById("nav-dbr").classList.add("active");
    document.getElementById("nav-"+p)?.classList.add("active");
  }
  saveSession();
  render();
}

function toggleSub(id) {
  const el = document.getElementById("sub-"+id);
  el.style.display = el.style.display==="none" ? "block" : "none";
}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
function render() {
  const el = document.getElementById("content");
  el.classList.add("fading");
  setTimeout(() => {
    el.classList.remove("fading");
    _doRender(el);
  }, 80);
}

function _doRender(el) {
  el = el || document.getElementById("content");
  const pages = {
    dashboard: renderDashboard,
    "m-barang": renderMBarang,
    "m-lokasi": renderMLokasi,
    "m-pic": renderMPic,
    "m-user": renderMUser,
    "t-input": renderInput,
    "t-pindah": renderPindah,
    laporan: renderLaporan,
  };
  el.innerHTML = (pages[page] || renderDashboard)();
}


function getGreeting() {
  const h = new Date().getHours();
  if (h >= 5  && h < 12) return "Selamat Pagi";
  if (h >= 12 && h < 15) return "Selamat Siang";
  if (h >= 15 && h < 18) return "Selamat Sore";
  return "Selamat Malam";
}
function getFirstName() {
  if (!currentUser || !currentUser.nama) return "Admin";
  // Ambil nama depan sebelum koma atau spasi kedua
  const nama = currentUser.nama.replace(/,.*$/, "").trim(); // hapus gelar belakang koma
  const parts = nama.split(" ");
  // Skip "Dr.", "H.", "Hj.", "Drs."
  const skip = ["dr.","h.","hj.","drs.","prof.","ir.","dra."];
  const clean = parts.filter(p => !skip.includes(p.toLowerCase()));
  return clean[0] || parts[0] || "Admin";
}
// ══════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════
function renderDashboard() {
  setBread(["Dashboard"]);
  const unit = currentUnit;
  const greeting = getGreeting();
  const firstName = getFirstName();
  const gQty = totalOf("qty", unit);
  const gBaik = countCond("Baik", unit);
  const gServis = countCond("Perbaikan", unit);
  const gRusak = countCond("Rusak", unit);

  const barData = (unit ? [unit] : UNITS).map(u => {
    const ids = LOKASI.filter(l=>l.unit===u).map(l=>l.id);
    const q = ids.reduce((s,id)=>s+roomItems(id).reduce((a,i)=>a+i.qty,0),0);
    const b = ids.reduce((s,id)=>s+roomItems(id).filter(i=>i.kondisi==="Baik").reduce((a,i)=>a+i.qty,0),0);
    const p = ids.reduce((s,id)=>s+roomItems(id).filter(i=>i.kondisi==="Perbaikan").reduce((a,i)=>a+i.qty,0),0);
    const r = ids.reduce((s,id)=>s+roomItems(id).filter(i=>i.kondisi==="Rusak").reduce((a,i)=>a+i.qty,0),0);
    return {name:u.replace("Fak. ","").replace("Fakultas ",""),q,b,p,r};
  }).filter(d=>d.q>0);
  const maxQ = Math.max(...barData.map(d=>d.q),1);
  const bars = barData.map(d=>`
    <div class="bar-group">
      <div class="bars">
        <div class="bar" style="height:${Math.round(d.b/maxQ*110)}px;background:#10B981" title="Baik: ${d.b}"></div>
        <div class="bar" style="height:${Math.round(d.p/maxQ*110)}px;background:#F97316" title="Perbaikan: ${d.p}"></div>
        <div class="bar" style="height:${Math.round(d.r/maxQ*110)}px;background:#EF4444" title="Rusak: ${d.r}"></div>
      </div>
      <div class="bar-label">${d.name}</div>
    </div>`).join("");

  const circ=2*Math.PI*54, pctB=pct(gBaik,gQty);
  return `
  <div class="ph" style="flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:20px">
    <div style="font-size:22px;font-weight:800">${greeting}, <span style="color:var(--accent)">${firstName}</span> 👋</div>
    <div style="font-size:13px;color:var(--text2)">
      ${unit ? `Inventaris ${unit}` : "Inventaris seluruh unit"} · ${new Date().toLocaleDateString("id-ID",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-ico">📦</div><div class="kpi-label">Total Aset</div><div class="kpi-val" style="color:#60A5FA">${fmt(gQty)}</div><div class="kpi-sub">${Object.values(ITEMS).flat().length} baris data</div><div class="kpi-bar"><div class="kpi-fill" style="width:100%;background:#3B82F6"></div></div></div>
    <div class="kpi"><div class="kpi-ico">✅</div><div class="kpi-label">Kondisi Baik</div><div class="kpi-val" style="color:#34D399">${fmt(gBaik)}</div><div class="kpi-sub">${pct(gBaik,gQty)}% dari total</div><div class="kpi-bar"><div class="kpi-fill" style="width:${pct(gBaik,gQty)}%;background:#10B981"></div></div></div>
    <div class="kpi"><div class="kpi-ico">🔧</div><div class="kpi-label">Perbaikan</div><div class="kpi-val" style="color:#FB923C">${fmt(gServis)}</div><div class="kpi-sub">${pct(gServis,gQty)}% sedang servis</div><div class="kpi-bar"><div class="kpi-fill" style="width:${pct(gServis,gQty)}%;background:#F97316"></div></div></div>
    <div class="kpi"><div class="kpi-ico">⚠️</div><div class="kpi-label">Rusak</div><div class="kpi-val" style="color:#F87171">${fmt(gRusak)}</div><div class="kpi-sub">${pct(gRusak,gQty)}% perlu tindakan</div><div class="kpi-bar"><div class="kpi-fill" style="width:${pct(gRusak,gQty)}%;background:#EF4444"></div></div></div>
  </div>
  <div class="charts-row">
    <div class="card">
      <div class="card-head"><div class="card-title">Distribusi Aset per Unit</div>
        <div style="display:flex;gap:10px">
          ${[["#10B981","Baik"],["#F97316","Perbaikan"],["#EF4444","Rusak"]].map(([c,l])=>`<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)"><span style="width:8px;height:8px;border-radius:2px;background:${c};display:inline-block"></span>${l}</span>`).join("")}
        </div>
      </div>
      <div class="card-body"><div class="bar-chart">${bars||'<div class="empty"><div class="empty-ico">📊</div><div class="empty-txt">Belum ada data</div></div>'}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">Kondisi Keseluruhan</div></div>
      <div class="card-body">
        <div class="pie-wrap">
          <div class="pie-ring">
            <svg width="120" height="120" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="12"/>
              <circle cx="60" cy="60" r="54" fill="none" stroke="#10B981" stroke-width="12" stroke-dasharray="${circ*pctB/100} ${circ}" stroke-linecap="round"/>
            </svg>
            <div class="pie-center"><div class="pie-pct">${pctB}%</div><div class="pie-lbl">Baik</div></div>
          </div>
          <div class="legend">
            <div class="leg-item"><div class="leg-dot" style="background:#10B981"></div>${fmt(gBaik)} Baik</div>
            <div class="leg-item"><div class="leg-dot" style="background:#F97316"></div>${fmt(gServis)} Perbaikan</div>
            <div class="leg-item"><div class="leg-dot" style="background:#EF4444"></div>${fmt(gRusak)} Rusak</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-head"><div class="card-title">Rekapitulasi per Unit</div></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Unit</th><th>Ruangan Terisi</th><th>Total Aset</th><th>Baik</th><th>Perbaikan</th><th>Rusak</th><th>% Baik</th></tr></thead>
      <tbody>${(unit?[unit]:UNITS).map(u=>{
        const ids=LOKASI.filter(l=>l.unit===u).map(l=>l.id);
        const q=ids.reduce((s,id)=>s+roomItems(id).reduce((a,i)=>a+i.qty,0),0);
        const b=ids.reduce((s,id)=>s+roomItems(id).filter(i=>i.kondisi==="Baik").reduce((a,i)=>a+i.qty,0),0);
        const p2=ids.reduce((s,id)=>s+roomItems(id).filter(i=>i.kondisi==="Perbaikan").reduce((a,i)=>a+i.qty,0),0);
        const r=ids.reduce((s,id)=>s+roomItems(id).filter(i=>i.kondisi==="Rusak").reduce((a,i)=>a+i.qty,0),0);
        const p=pct(b,q);
        const terisi=ids.filter(id=>roomItems(id).length>0).length;
        return `<tr>
          <td style="font-weight:700">${u}</td>
          <td><span class="badge b-blue">${terisi} / ${ids.length}</span></td>
          <td style="font-weight:700">${fmt(q)}</td>
          <td style="color:#34D399;font-weight:600">${fmt(b)}</td>
          <td style="color:#FB923C;font-weight:600">${fmt(p2)}</td>
          <td style="color:#F87171;font-weight:600">${fmt(r)}</td>
          <td><div style="display:flex;align-items:center;gap:8px"><div class="prog" style="width:60px"><div class="prog-fill" style="width:${p}%;background:${p>=90?"#10B981":p>=70?"#F59E0B":"#EF4444"}"></div></div><span style="font-size:12px;font-weight:700;color:${p>=90?"#34D399":p>=70?"#FCD34D":"#F87171"}">${q?p+"%":"—"}</span></div></td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>
  </div>`;
}

// AUTOCOMPLETE ACTIONS
// ══════════════════════════════════════════════════════
function onAcInput(val) {
  newItem.nama = val;
  // Update suggestion list langsung tanpa render() penuh
  const list = document.getElementById("ac-list");
  if (!list) return;
  if (!val || val.length < 1) { list.innerHTML = ""; list.style.display = "none"; return; }
  const suggestions = MASTER_BARANG.filter(b => b.toLowerCase().includes(val.toLowerCase())).slice(0, 8);
  if (suggestions.length === 0) { list.innerHTML = ""; list.style.display = "none"; return; }
  const re = new RegExp(val.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  list.innerHTML = suggestions.map(s =>
    `<div class="ac-item" onmousedown="selectAc('${s.replace(/'/g, "\\'")}')">${s.replace(re, m => `<mark>${m}</mark>`)}</div>`
  ).join("");
  list.style.display = "block";
}
function selectAc(val) {
  newItem.nama = val;
  // Isi input langsung, tutup dropdown
  const inp = document.getElementById("ac-input");
  if (inp) { inp.value = val; }
  const list = document.getElementById("ac-list");
  if (list) { list.style.display = "none"; }
  // Fokus ke qty
  setTimeout(() => {
    const qty = document.getElementById("add-qty");
    if (qty) qty.focus();
  }, 30);
}

// ══════════════════════════════════════════════════════
// CRUD ITEMS
// ══════════════════════════════════════════════════════
function doAdd(roomId) {
  const nama    = (document.getElementById("ac-input")?.value || "").trim();
  const qty     = +document.getElementById("add-qty")?.value || 1;
  const kondisi = document.getElementById("add-cond")?.value || "Baik";
  if (!nama) { toast("Nama barang harus diisi!", "red"); return; }
  if (!["Baik","Perbaikan","Rusak"].includes(kondisi)) { toast("Kondisi tidak valid!", "red"); return; }

  // Optimistic update UI dulu
  if (!ITEMS[roomId]) ITEMS[roomId] = [];
  const tempId = "tmp-" + Date.now();
  ITEMS[roomId].push({id:tempId, nama, qty, kondisi, diinput_oleh: currentUser?.nama?.split(",")[0]||"—", updated_at:now()});
  newItem = {nama:"", qty:1, kondisi:"Baik"};
  addOpen = false;
  render();

  // Simpan ke Supabase
  const lokasiRow = LOKASI_DATA.find(l => l.id === roomId) || LOKASI.find(l => l.id === roomId);
  const kodeRuangan = lokasiRow?.kode_ruangan;
  if (!kodeRuangan) { toast("Kode ruangan tidak ditemukan!", "red"); return; }

  sbPost("dbr_data", {
    kode_ruangan: kodeRuangan, nama_barang: nama, qty, kondisi,
    diinput_oleh: currentUser?.nama?.split(",")[0]||"—",
    tahun: new Date().getFullYear().toString()
  }).then(rows => {
    // Ganti tempId dengan ID asli dari Supabase
    if (rows && rows[0]) {
      const real = rows[0];
      ITEMS[roomId] = ITEMS[roomId].map(i => i.id===tempId ? {...i, id:real.id, kode_ruangan:real.kode_ruangan} : i);
    }
    toast("Barang berhasil disimpan!");
  }).catch(e => {
    ITEMS[roomId] = ITEMS[roomId].filter(i => i.id !== tempId);
    render();
    toast("Gagal menyimpan: " + e.message, "red");
  });
}

function startEdit(itemId) {
  editingId = itemId;
  render();
}
function cancelEdit() {
  editingId = null;
  render();
}
function saveEdit(roomId, itemId) {
  const qty = +document.getElementById("edit-qty")?.value || 1;
  const kondisi = document.getElementById("edit-cond")?.value || "Baik";
  ITEMS[roomId] = ITEMS[roomId].map(i =>
    i.id===itemId ? {...i, qty, kondisi, diinput_oleh: currentUser?.nama?.split(",")[0]||"—", updated_at:now()} : i
  );
  editingId = null;
  render();
  // Simpan ke Supabase (kalau bukan temp id)
  if (!String(itemId).startsWith("tmp-")) {
    sbPatch("dbr_data", itemId, {qty, kondisi, diinput_oleh: currentUser?.nama?.split(",")[0]||"—"})
      .then(() => toast("Data berhasil diperbarui!"))
      .catch(e => toast("Gagal update: " + e.message, "red"));
  } else {
    toast("Data berhasil diperbarui!");
  }
}
function deleteItem(roomId, itemId) {
  ITEMS[roomId] = (ITEMS[roomId]||[]).filter(i=>i.id!==itemId);
  render();
  if (!String(itemId).startsWith("tmp-")) {
    sbDelete("dbr_data", itemId)
      .then(() => toast("Barang dihapus."))
      .catch(e => toast("Gagal hapus: " + e.message, "red"));
  } else {
    toast("Barang dihapus.");
  }
}

async function sbGet(table, params = {}) {
  const qs = new URLSearchParams(params);
  const res = await fetch(`${SB_URL}/rest/v1/${table}?${qs}`, {
    headers: {
      "apikey": SB_KEY,
      "Authorization": "Bearer " + SB_KEY,
      "Content-Type": "application/json",
    }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbPost(table, body) {
  const res = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: "POST",
    headers: {
      "apikey": SB_KEY,
      "Authorization": "Bearer " + SB_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=representation",
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbPatch(table, id, body) {

  });
  if (!res.ok) throw new Error(await res.text());

}

// ── AUTH ──────────────────────────────────────────────────────
async function sbLogin(username, password) {
  const hash = await sha256(password);
  const rows = await sbGet("users", {
    username: `eq.${username}`,
    status: "eq.Aktif",
    select: "nip,nama,jabatan,unit,role,username,password_hash"
  });
  if (!rows || rows.length === 0) throw new Error("Username tidak ditemukan");
  const user = rows[0];
  // Kalau password_hash kosong (setup awal), langsung set
  if (!user.password_hash || user.password_hash.trim() === '') {
    await fetch(`${SB_URL}/rest/v1/users?username=eq.${username}`, {
      method: "PATCH",
      headers: {"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({password_hash: hash})
    });
  } else if (user.password_hash !== hash) {
    throw new Error("Password salah");
  }
  return {nip:user.nip, nama:user.nama, jabatan:user.jabatan, unit:user.unit, role:user.role, username:user.username};
}

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

  if (!confirm(`Nonaktifkan user "${username}"?`)) return;
  try {
    await sbPatch("users", id, {status:"Nonaktif"});
    await loadMasterData();
    render();
    toast("User dinonaktifkan.");
  } catch(e) {
    toast("Gagal: " + e.message, "red");
  }
}

// ── PDF GENERATOR ─────────────────────────────────────────────
async function cetakPDF(lokasi) {
  // Load data barang ruangan kalau belum ada
  const kode = lokasi.kode_ruangan;
  if (!ITEMS[lokasi.id] || ITEMS[lokasi.id].length === 0) {
    try {
      const rows = await sbGet("dbr_data", {kode_ruangan:`eq.${kode}`,select:"*",order:"created_at"});
      ITEMS[lokasi.id] = (rows||[]).map(r=>({id:r.id,nama:r.nama_barang,qty:r.qty,kondisi:r.kondisi,diinput_oleh:r.diinput_oleh,updated_at:r.updated_at?.split("T")[0]||""}));
    } catch(e) { ITEMS[lokasi.id] = []; }
  }

  const items = ITEMS[lokasi.id] || [];
  const pic   = PICS_DATA.find(p => p.unit === lokasi.unit);
  const namaRuangan = lokasi.nama_ruangan || lokasi.nama || "";
  const tgl   = new Date().toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});

  const rows = items.map((item,i) => `
    <tr>
      <td style="text-align:center">${i+1}</td>
      <td>${item.nama}</td>
      <td style="text-align:center">${item.qty}</td>
      <td style="text-align:center">Unit</td>
      <td style="text-align:center"><span style="color:${item.kondisi==="Baik"?"green":item.kondisi==="Perbaikan"?"orange":"red"}">${item.kondisi}</span></td>
      <td>${item.diinput_oleh||""}</td>
    </tr>`).join("");

  const win = window.open("","_blank");
  win.document.write(`<!DOCTYPE html><html lang="id"><head>
    <meta charset="UTF-8"/>
    <title>DBR - ${namaRuangan}</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:Arial,sans-serif;font-size:12px;color:#000;padding:20px}
      .kop{display:flex;align-items:center;gap:16px;border-bottom:3px double #000;padding-bottom:10px;margin-bottom:16px}
      .kop-logo{width:70px;height:70px;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:10px;color:#555;text-align:center;flex-shrink:0}
      .kop-text{flex:1;text-align:center}
      .kop-text h1{font-size:15px;font-weight:bold;margin-bottom:2px}
      .kop-text h2{font-size:13px;font-weight:bold;margin-bottom:2px}
      .kop-text p{font-size:10px;color:#333}
      .title{text-align:center;font-size:14px;font-weight:bold;margin:12px 0 4px;text-transform:uppercase;text-decoration:underline}
      .info{margin:10px 0;font-size:11px}
      .info table{border-collapse:collapse}
      .info td{padding:2px 8px 2px 0;vertical-align:top}
      .info td:nth-child(2){padding:2px 12px}
      table.barang{width:100%;border-collapse:collapse;margin:12px 0;font-size:11px}
      table.barang th{background:#ddd;border:1px solid #000;padding:5px 8px;text-align:center;font-weight:bold}
      table.barang td{border:1px solid #000;padding:4px 8px;vertical-align:middle}
      table.barang tbody tr:nth-child(even){background:#f9f9f9}
      .ttd{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:32px;font-size:11px}
      .ttd-box{text-align:center}
      .ttd-box .garis{margin-top:52px;border-top:1px solid #000;padding-top:4px;font-weight:bold}
      .ttd-box .nip{font-size:10px;color:#333}
      .total-row td{font-weight:bold;background:#eee}
      @media print{body{padding:10px}button{display:none}}
    </style>
  </head><body>
    <div class="kop">
      <div class="kop-logo">LOGO<br/>UIN<br/>KEDIRI</div>
      <div class="kop-text">
        <h1>UNIVERSITAS ISLAM NEGERI ABDURRAHMAN WAHID KEDIRI</h1>
        <h2>DAFTAR BARANG RUANGAN (DBR)</h2>
        <p>Jl. Sunan Ampel No.7, Ngronggo, Kec. Kota, Kota Kediri, Jawa Timur 64127</p>
      </div>
    </div>

    <div class="title">Daftar Barang Ruangan</div>

    <div class="info"><table>
      <tr><td>Nama Ruangan</td><td>:</td><td><strong>${namaRuangan}</strong></td></tr>
      <tr><td>Gedung</td><td>:</td><td>${lokasi.gedung}</td></tr>
      <tr><td>Unit / Fakultas</td><td>:</td><td>${lokasi.unit}</td></tr>
      <tr><td>Tahun</td><td>:</td><td>${new Date().getFullYear()}</td></tr>
    </table></div>

    <table class="barang">
      <thead><tr>
        <th style="width:35px">No.</th>
        <th>Nama Barang</th>
        <th style="width:50px">Qty</th>
        <th style="width:50px">Satuan</th>
        <th style="width:80px">Kondisi</th>
        <th style="width:120px">Dicatat Oleh</th>
      </tr></thead>
      <tbody>
        ${rows || `<tr><td colspan="6" style="text-align:center;padding:20px;color:#999">Belum ada data barang</td></tr>`}
        <tr class="total-row">
          <td colspan="2" style="text-align:right">TOTAL</td>
          <td style="text-align:center">${items.reduce((s,x)=>s+x.qty,0)}</td>
          <td colspan="3"></td>
        </tr>
      </tbody>
    </table>

    <div class="ttd">
      <div class="ttd-box">
        <div>Mengetahui,</div>
        <div>Penanggung Jawab</div>
        <div class="garis">${pic?.nama || "................................"}</div>
        <div class="nip">NIP. ${pic?.nip || "................................"}</div>
      </div>
      <div class="ttd-box">
        <div>Kediri, ${tgl}</div>
        <div>Yang Membuat,</div>
        <div class="garis">${currentUser?.nama?.replace(/,.*$/,"").trim() || "................................"}</div>
        <div class="nip">NIP. ${currentUser?.nip || "................................"}</div>
      </div>
    </div>

    <div style="margin-top:16px;text-align:center">
      <button onclick="window.print()" style="padding:8px 24px;background:#1D4ED8;color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px">🖨️ Print / Save PDF</button>
    </div>
  </body></html>`);
  win.document.close();
  setTimeout(() => win.print(), 500);
}

// ── SIDEBAR TOGGLE ────────────────────────────────────
function toggleSidebar() {
  const sb  = document.querySelector(".sidebar");
  const ov  = document.getElementById("sidebar-overlay");
  const mobile = window.innerWidth <= 768;
  sb.classList.toggle("collapsed");
  if (mobile && ov) ov.classList.toggle("visible", !sb.classList.contains("collapsed"));
  localStorage.setItem("simdbr_sidebar", sb.classList.contains("collapsed") ? "0" : "1");
}

// ── THEME TOGGLE ──────────────────────────────────────
function toggleTheme() {
  const isLight = document.body.classList.toggle("light");
  localStorage.setItem("simdbr_theme", isLight ? "light" : "dark");
  const btn = document.getElementById("theme-btn");
  if (btn) btn.textContent = isLight ? "☀️" : "🌙";
}

// ── RESTORE THEME & SIDEBAR ───────────────────────────
(function initPrefs() {
  // Theme
  const theme = localStorage.getItem("simdbr_theme");
  if (theme === "light") {
    document.body.classList.add("light");
    const btn = document.getElementById("theme-btn");
    if (btn) btn.textContent = "☀️";
  }
  // Sidebar (desktop only)
  if (window.innerWidth > 768) {
    const sidebarPref = localStorage.getItem("simdbr_sidebar");
    if (sidebarPref === "0") {
      document.querySelector(".sidebar")?.classList.add("collapsed");
    }
  }
})();


// ── Apply user UI (sidebar info) ─────────────────────────────
function applyUserUI() {
  if (!currentUser || !currentRole) return;
  const isSA = currentRole === "superadmin";
  const isBMN = currentRole === "bmn";

  document.getElementById("sb-uname").textContent =
    isSA ? "Bag. Umum" : currentUser.nama.split(",")[0];
  document.getElementById("sb-urole").textContent =
    isSA ? "Super Admin" : isBMN ? "BMN — Bag. Umum" : "Admin Fakultas";
  document.getElementById("sb-av").textContent =
    (currentUser.nama || "A")[0].toUpperCase();

  const unitEl = document.getElementById("sb-unit");
  if (!isSA && !isBMN) {
    unitEl.textContent = currentUnit || "";
    unitEl.style.display = "block";
  } else {
    unitEl.style.display = "none";
  }

  // Sembunyikan menu superadmin-only untuk non-superadmin
  ["nav-m-user"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = (isSA ? "" : "none");
  });
}

// ── Auto-restore session saat refresh ────────────────────────
(function() {
  if (currentRole && currentUser) {
    document.getElementById("login-page").style.display = "none";
    document.getElementById("app").style.display = "flex";
    document.getElementById("topbar-date").textContent =
      new Date().toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
    applyUserUI();
    loadMasterData();

    // Restore active nav
    document.querySelectorAll(".sb-item").forEach(el=>el.classList.remove("active"));
    if (page === "dashboard") document.getElementById("nav-dashboard")?.classList.add("active");
    if (page === "laporan")   document.getElementById("nav-laporan")?.classList.add("active");
    if (page.startsWith("m-")) {
      document.getElementById("sb-master-item")?.classList.add("active");
      document.getElementById("sub-master").style.display = "block";
      document.getElementById("nav-"+page)?.classList.add("active");
    }
    if (page.startsWith("t-")) {
      document.getElementById("nav-dbr")?.classList.add("active");
      document.getElementById("sub-dbr").style.display = "block";
      document.getElementById("nav-"+page)?.classList.add("active");
    }
    render();
  }
})();
</script>
